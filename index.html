<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>나나커플의 부부생활 규칙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#5e3a4e; --wine:#a85c79; --rose:#eeb7c8; --blush:#fff6f7; --cream:#fffaf2; --gold:#d8a96d; --lav:#ece5f6; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(140deg,#fff7f7 0%,#f8eff8 50%,#fff8ed 100%); font-family:'Gowun Batang',serif; min-height:100vh; }
    body:before, body:after { content:'✦'; position:fixed; color:#e7bfd5; font-size:2rem; opacity:.55; pointer-events:none; } body:before { top:16%; left:6%; } body:after { right:7%; bottom:18%; }
    .wrap { width:min(100%, 760px); margin:auto; padding:28px 18px 48px; }
    header { position:relative; text-align:center; padding:28px 16px 24px; border:1px solid #e7c9d4; background:rgba(255,255,255,.68); box-shadow:0 12px 35px rgba(148,89,117,.1); border-radius:28px 28px 70px 70px; overflow:hidden; }
    header:before { content:'❦  ♛  ❦'; letter-spacing:10px; color:var(--gold); font-size:1.15rem; } h1 { margin:12px 0 7px; font:800 clamp(1.65rem,6vw,2.45rem)/1.25 'Nanum Myeongjo',serif; color:#8f4968; } .subtitle { margin:0; font-size:.92rem; color:#916879; }
    .quote { margin:20px 4px 18px; padding:16px 20px; border-radius:18px; background:#f6eaf3; color:#926075; text-align:center; font-size:.93rem; line-height:1.6; }
    .toolbar { display:flex; gap:10px; margin:18px 0 10px; align-items:center; } .search { flex:1; min-width:0; padding:13px 15px; border:1px solid #e7ccd8; border-radius:14px; background:#fff; font:inherit; color:var(--ink); outline:none; } .search:focus { border-color:var(--wine); box-shadow:0 0 0 3px #f9dce7; }
    button { border:0; cursor:pointer; font:700 .9rem 'Gowun Batang',serif; transition:.2s transform,.2s box-shadow; } button:active { transform:scale(.97); }
    .add { flex:0 0 auto; padding:13px 16px; border-radius:14px; color:white; background:linear-gradient(135deg,#c97b9a,#9d5172); box-shadow:0 5px 12px #dba3b7; }
    .sort-row { display:flex; justify-content:flex-end; margin:0 0 4px; } .sort { min-width:135px; padding:7px 9px; border:1px solid #ecd4de; border-radius:10px; color:#8c6175; background:#fffafd; font:inherit; font-size:.78rem; outline:none; } .status { display:flex; justify-content:space-between; padding:8px 4px 13px; font-size:.82rem; color:#957181; } .status strong { color:var(--wine); }
    #rules { display:grid; gap:12px; } .card { position:relative; padding:17px 16px 14px 19px; background:rgba(255,255,255,.85); border:1px solid #f0dbe3; border-radius:18px; box-shadow:0 5px 15px rgba(133,77,108,.07); border-left:5px solid var(--card-color,#e6aac0); }
    .card.done { opacity:.62; background:#fffafb; } .top { display:flex; gap:10px; align-items:flex-start; } .check { appearance:none; flex:0 0 21px; width:21px; height:21px; margin:2px 0 0; border:1.5px solid #d9a7bb; border-radius:50%; background:white; cursor:pointer; } .check:checked { background:var(--wine); box-shadow:inset 0 0 0 4px white; border-color:var(--wine); }
    .content { flex:1; min-width:0; } .category { display:inline-block; margin-bottom:5px; padding:3px 8px; background:var(--lav); border-radius:20px; font-size:.7rem; color:#76608f; } .rule-title { margin:0; font:700 1.08rem/1.35 'Nanum Myeongjo',serif; } .rule-detail { margin:5px 0 0; font-size:.84rem; color:#876d79; line-height:1.55; }
    .stars { margin:9px 0 1px; letter-spacing:2px; font:1.45rem/1 Georgia,serif; color:#eadde3; white-space:nowrap; } .stars .on { color:#e5ad55; text-shadow:0 1px 1px #b68136; }
    .actions { display:flex; justify-content:flex-end; gap:4px; margin-top:10px; } .icon { width:32px; height:30px; border-radius:9px; color:#93627a; background:#fff1f5; } .delete { color:#c57683; background:#fff5f4; }
    .empty { padding:42px 15px; text-align:center; border:1px dashed #dfb4c4; border-radius:18px; color:#9c7082; background:#fffafb; }
    dialog { width:min(calc(100% - 28px),520px); border:0; border-radius:24px; padding:0; color:var(--ink); box-shadow:0 20px 60px #76516180; background:var(--cream); } dialog::backdrop { background:#6c415560; backdrop-filter:blur(3px); } .form { padding:24px; } .form h2 { margin:0 0 19px; font:800 1.35rem 'Nanum Myeongjo',serif; color:#8f4968; } label { display:block; margin:13px 0 6px; font-size:.82rem; color:#795568; } input, textarea, select { width:100%; padding:12px; border:1px solid #e7cbd7; border-radius:12px; font:inherit; color:var(--ink); background:white; outline:none; } textarea { min-height:82px; resize:vertical; } input:focus, textarea:focus, select:focus { border-color:var(--wine); box-shadow:0 0 0 3px #f9dce7; } .rating { display:flex; flex-direction:row-reverse; justify-content:flex-end; gap:3px; } .rating input { position:absolute; opacity:0; pointer-events:none; } .rating label { display:block; margin:0; width:38px; height:42px; text-align:center; font:2rem/1.3 Georgia,serif; color:#e7dce1; cursor:pointer; } .rating label:hover, .rating label:hover~label, .rating input:checked~label { color:#e5ad55; text-shadow:0 1px 1px #b68136; } .form-actions { display:flex; gap:9px; justify-content:flex-end; margin-top:21px; } .cancel { padding:11px 15px; background:#f0e8eb; color:#856372; border-radius:12px; } .save { padding:11px 17px; background:var(--wine); color:white; border-radius:12px; }
    footer { padding-top:27px; text-align:center; color:#ad8797; font-size:.76rem; } @media (max-width:410px) { .wrap { padding:17px 12px 35px; } header { padding:23px 10px 21px; } .toolbar { gap:7px; } .add { padding:13px 12px; } .card { padding:15px 12px 12px 15px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header><div aria-hidden="true"></div><h1>나나커플의<br>부부생활 규칙</h1><p class="subtitle">서로를 가장 아끼는 우리만의 약속 노트</p></header>
    <p class="quote">“완벽해서가 아니라, 함께 다듬어가서 더 빛나는 우리.”</p>
    <section aria-label="규칙 관리"><div class="toolbar"><input class="search" id="search" type="search" placeholder="규칙을 찾아보세요" aria-label="규칙 검색"><button class="add" id="addBtn">+ 새 약속</button></div><div class="sort-row"><select class="sort" id="sort" aria-label="규칙 정렬 방식"><option value="newest">최신 순</option><option value="oldest">오래된 순</option><option value="alphabetical">가나다라 순</option><option value="stars">별점 높은 순</option></select></div><div class="status"><span>우리의 약속 <strong id="count">0</strong>개</span><span id="doneText">0개 지켰어요 ♡</span></div><div id="rules"></div></section>
    <footer>나나커플의 작은 궁전 · 모든 약속은 이 기기에 저장돼요</footer>
  </main>
  <dialog id="editor"><form class="form" id="ruleForm"><h2 id="formTitle">새로운 약속</h2><input type="hidden" id="ruleId"><label for="title">약속 제목</label><input id="title" required maxlength="60" placeholder="예: 하루 한 번 꼭 안아주기"><label for="category">카테고리</label><select id="category"><option>소통</option><option>집안일</option><option>재정</option><option>시간</option><option>신뢰</option><option>애정</option><option>기타</option></select><label>중요도 <small>(별을 눌러 선택)</small></label><div class="rating" aria-label="중요도 별점"><input id="star5" type="radio" name="stars" value="5"><label for="star5" title="매우 중요">★</label><input id="star4" type="radio" name="stars" value="4"><label for="star4" title="중요">★</label><input id="star3" type="radio" name="stars" value="3"><label for="star3" title="보통">★</label><input id="star2" type="radio" name="stars" value="2"><label for="star2" title="약간 중요">★</label><input id="star1" type="radio" name="stars" value="1"><label for="star1" title="참고">★</label><input id="star0" type="radio" name="stars" value="0" checked><label for="star0" title="별점 없음">☆</label></div><label for="detail">자세한 내용 <small>(선택)</small></label><textarea id="detail" maxlength="200" placeholder="우리만의 구체적인 방법을 적어봐요."></textarea><div class="form-actions"><button class="cancel" type="button" id="cancelBtn">취소</button><button class="save" type="submit">저장하기</button></div></form></dialog>
  <script>
    const seed=[
      ['소통','하루 10분, 오늘의 마음 나누기','해결책보다 먼저 서로의 이야기를 끝까지 들어주기'],
      ['소통','서운함은 쌓아두지 않기','감정이 격해졌다면 잠시 쉬고, “나는 이렇게 느꼈어”로 말하기'],
      ['집안일','집안일은 함께, 빈틈은 서로 돕기','담당을 정하되 바쁜 날에는 눈치 보지 않고 기꺼이 돕기'],
      ['재정','월 1회 우리 돈 이야기','한 달의 지출과 다음 달 계획을 편안하게 함께 살피기'],
      ['시간','각자의 혼자만의 시간 존중하기','혼자 쉬고 싶은 마음도 사랑의 일부로 이해하기'],
      ['애정','매주 한 번은 우리만의 데이트','거창하지 않아도 좋아요. 산책, 커피, 영화 한 편도 충분해요'],
      ['신뢰','일정과 중요한 일은 미리 공유하기','상대가 불안해하지 않도록 자연스럽고 솔직하게 알려주기'],
      ['시간','매달 마지막 주말, 약속 점검하기','잘 지킨 것은 칭찬하고 어려운 규칙은 함께 새로 조정하기']
    ].map((x,i)=>({id:Date.now()+i,title:x[1],category:x[0],detail:x[2],stars:0,done:false}));
    const colors={소통:'#dca5bf',집안일:'#9ac7bd',재정:'#d7b36d',시간:'#afa0d3',신뢰:'#8fbcd1',애정:'#ed9faa',기타:'#c7ad9a'};
    let rules; try { rules=JSON.parse(localStorage.getItem('nana-couple-rules'))||seed } catch { rules=seed }
    const $=s=>document.querySelector(s), list=$('#rules'), dialog=$('#editor'), form=$('#ruleForm'); $('#sort').value=localStorage.getItem('nana-couple-sort')||'newest';
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
    function persist(){localStorage.setItem('nana-couple-rules',JSON.stringify(rules))}
    function render(){const q=$('#search').value.trim().toLowerCase(), mode=$('#sort').value; const visible=rules.filter(r=>(r.title+r.category+r.detail).toLowerCase().includes(q)).sort((a,b)=>{if(mode==='alphabetical')return a.title.localeCompare(b.title,'ko');if(mode==='stars')return (Number(b.stars)||0)-(Number(a.stars)||0)||b.id-a.id;if(mode==='oldest')return a.id-b.id;return b.id-a.id}); $('#count').textContent=rules.length; $('#doneText').textContent=rules.filter(r=>r.done).length+'개 지켰어요 ♡'; list.innerHTML=visible.length?visible.map(r=>{const stars=Math.max(0,Math.min(5,Number(r.stars)||0));return `<article class="card ${r.done?'done':''}" style="--card-color:${colors[r.category]||colors.기타}"><div class="top"><input class="check" type="checkbox" ${r.done?'checked':''} data-check="${r.id}" aria-label="${escapeHtml(r.title)} 완료"><div class="content"><span class="category">${escapeHtml(r.category)}</span><h3 class="rule-title">${escapeHtml(r.title)}</h3>${stars?`<div class="stars" aria-label="중요도 ${stars}점"><span class="on">${'★'.repeat(stars)}</span>${'★'.repeat(5-stars)}</div>`:''}${r.detail?`<p class="rule-detail">${escapeHtml(r.detail)}</p>`:''}</div></div><div class="actions"><button class="icon" data-edit="${r.id}" aria-label="수정">✎</button><button class="icon delete" data-delete="${r.id}" aria-label="삭제">×</button></div></article>`}).join(''):'<div class="empty">찾는 약속이 없어요.<br>새로운 약속을 만들어볼까요? ♡</div>'}
    function openEditor(rule){form.reset(); $('#star0').checked=true; $('#ruleId').value=rule?.id||''; $('#formTitle').textContent=rule?'약속 수정하기':'새로운 약속'; if(rule){$('#title').value=rule.title;$('#category').value=rule.category;$('#detail').value=rule.detail; $(`#star${Number(rule.stars)||0}`).checked=true} dialog.showModal(); setTimeout(()=>$('#title').focus(),100)}
    $('#addBtn').onclick=()=>openEditor(); $('#cancelBtn').onclick=()=>dialog.close(); $('#search').oninput=render; $('#sort').onchange=()=>{localStorage.setItem('nana-couple-sort',$('#sort').value);render()};
    form.onsubmit=e=>{e.preventDefault();const id=$('#ruleId').value, item={id:id?Number(id):Date.now(),title:$('#title').value.trim(),category:$('#category').value,detail:$('#detail').value.trim(),stars:Number(document.querySelector('input[name="stars"]:checked').value),done:false}; if(id){const old=rules.find(r=>r.id===item.id);item.done=old.done;rules=rules.map(r=>r.id===item.id?item:r)}else rules.unshift(item);persist();render();dialog.close()};
    list.onclick=e=>{const b=e.target.closest('button'); if(!b)return;const id=Number(b.dataset.edit||b.dataset.delete), rule=rules.find(r=>r.id===id); if(b.dataset.edit)openEditor(rule); if(b.dataset.delete&&confirm('이 약속을 지울까요?')){rules=rules.filter(r=>r.id!==id);persist();render()}};
    list.onchange=e=>{if(e.target.matches('[data-check]')){const id=Number(e.target.dataset.check);rules=rules.map(r=>r.id===id?{...r,done:e.target.checked}:r);persist();render()}}; render();
  </script>
</body>
</html>
